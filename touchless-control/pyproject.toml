[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "touchless-control"
version = "0.1.0"
description = "Control your computer with hand gestures and voice commands"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "Apache-2.0"}

[project.scripts]
touchless = "src.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
